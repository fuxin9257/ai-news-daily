name: Daily AI News Collection

on:
  schedule:
    # Run at 23:00 UTC = 07:00 Beijing time (UTC+8)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      note:
        description: "Manual trigger note"
        required: false
        default: "Manual run"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run news collection
        run: python scripts/collect_news.py

      - name: Commit and push new data
        run: |
          git config --local user.email "ai-news-bot[bot]@users.noreply.github.com"
          git config --local user.name "AI News Bot"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "feat: auto-collect AI news $(date -u +%Y-%m-%d)"
            git push
            echo "Data committed and pushed."
          fi

      - name: Upload collection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-log
          path: /tmp/collection-*.log
          retention-days: 7
